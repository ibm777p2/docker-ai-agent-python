services: # docker compose expects
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8080:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 #--reload we restart the entire container instead of the process
    environment:
      - PORT=8000
      - MY_PROJECT=Nice Site
    env_file:
      - .env.sample
    volumes:
      - ./backend/src:/app
    depends_on:
      - db_service
    develop:
      watch:
        - action: rebuild
          path: backend/requirements.txt
        - action: rebuild
          path: backend/Dockerfile
        - action: restart #restart we sync instead of restart
          path: backend/src/
          #target: /app

  #DATABASE_URL=postgresql+psycopg://dbuser:db-password@db_service:5432/camba
  db_service:
    image: postgres:17.5
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=db-password
      - POSTGRES_DB=camba
    #env_file:
    #  - .env.sample-db
    volumes:
      - dc_managed_db_volume:/var/lib/postgresql/data

  # static_html: # custom key name
